name: DSS FIELD · ATMOS
on:
  # GitHub's schedule is best-effort (hours apart on this repo). So each run is a
  # 5h45 loop: engine every 10 min. The next scheduled/pushed run queues behind
  # it (concurrency) and takes over, giving continuous coverage without any
  # external pinger. A push to main cancels the loop and restarts with new code.
  push:
    branches: [main]
  repository_dispatch:
    types: [atmos-run]
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      event: { description: "events/<name>.yaml", default: "events/mq.yaml" }
# Only a push (new code) cancels the running loop. Scheduled and relay runs queue behind it and
# take over when it ends, so its post-steps (output cache for the degraded fallback) are not lost.
concurrency:
  group: atmos-${{ github.event.inputs.event || 'events/mq.yaml' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
  actions: write          # relay: the job dispatches its own successor
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore last products (for degraded fallback)
        uses: actions/cache@v4
        with:
          path: output
          key: atmos-output-${{ github.run_id }}
          restore-keys: atmos-output-
      - run: python -m pytest -q
      - name: Run engine
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          end=$((SECONDS + 340*60))
          while [ $SECONDS -lt $end ]; do
            python -m atmos.run --event "${{ github.event.inputs.event || 'events/mq.yaml' }}" --products status,field --publish --cards || true
            sleep 600
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: atmos-output, path: output, retention-days: 30 }
      # Relay. GitHub's cron is best-effort: on 2026-11-11 the loop ended 07:37 and the 08:07 cron
      # fired at 09:16, leaving 1h40 without a run in the middle of an orange warning. The loop now
      # starts its successor itself; the cron stays only as a safety net. Skipped when cancelled
      # (a push is already replacing this run).
      - name: Relay — dispatch the next loop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atmos.yml --repo "${{ github.repository }}" --ref main -f event="${{ github.event.inputs.event || 'events/mq.yaml' }}"
